<template>
  <template lwc:if={hasSections}>
    <template for:each={sections} for:item="section">
      <c-contentful-section
        key={section.key}

        route={route}
        home-page-name={homePageName}
        about-page-name={aboutPageName}
        faq-page-name={faqPageName}
        contact-page-name={contactPageName}
        catalog-page-name={catalogPageName}
        apply-page-name={applyPageName}
      ></c-contentful-section>
    </template>
  </template>
</template>
