<template>
  <div class="slds-var-p-around_small">
    <h2
      class="slds-text-title_caps slds-text-color_weak slds-var-m-bottom_small"
    >
      Personal Settings
    </h2>

    <lightning-tabset variant="vertical">
      <!-- ═══════════════════ User Details ═══════════════════ -->
      <lightning-tab label="User Details" value="user-details">
        <article class="slds-card">
          <div class="slds-card__header slds-grid">
            <header
              class="slds-media slds-media_center slds-has-flexi-truncate"
            >
              <div class="slds-media__figure">
                <lightning-icon
                  icon-name="standard:user"
                  size="small"
                ></lightning-icon>
              </div>
              <div class="slds-media__body">
                <h3 class="slds-card__header-title">
                  <span class="slds-text-heading_small">{profileHeader}</span>
                </h3>
              </div>
            </header>
            <div class="slds-no-flex">
              <template if:true={isViewMode}>
                <lightning-button
                  variant="brand"
                  label={profileButtonLabel}
                  title="Edit profile"
                  onclick={handleEdit}
                ></lightning-button>
              </template>
            </div>
          </div>

          <div class="slds-card__body slds-card__body_inner">
            <!-- ── View mode ── -->
            <template if:true={isViewMode}>
              <lightning-record-view-form
                record-id={userId}
                object-api-name={objectApiName}
                class="slds-is-relative"
              >
                <template for:each={profileFieldRows} for:item="field">
                  <div key={field.key} class="slds-var-p-vertical_xx-small">
                    <lightning-output-field
                      field-name={field.fieldName}
                    ></lightning-output-field>
                  </div>
                </template>

                <template if:true={hasLocationFields}>
                  <div class="slds-section slds-is-open slds-var-m-top_small">
                    <h4 class="slds-section__title slds-theme_shade">
                      <span
                        class="slds-truncate slds-p-horizontal_small"
                        title="Location"
                        >Location</span
                      >
                    </h4>
                    <div class="slds-section__content slds-var-p-top_small">
                      <template for:each={locationFieldRows} for:item="field">
                        <div
                          key={field.key}
                          class="slds-var-p-vertical_xx-small"
                        >
                          <lightning-output-field
                            field-name={field.fieldName}
                          ></lightning-output-field>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>
              </lightning-record-view-form>
            </template>

            <!-- ── Edit mode ── -->
            <template if:false={isViewMode}>
              <template if:true={showEmailDisclaimer}>
                <div
                  class="slds-scoped-notification slds-scoped-notification_light slds-media slds-media_center slds-var-m-bottom_medium"
                  role="status"
                >
                  <div class="slds-media__figure">
                    <lightning-icon
                      icon-name="utility:info"
                      size="small"
                    ></lightning-icon>
                  </div>
                  <div class="slds-media__body">
                    <p>{emailDisclaimer}</p>
                  </div>
                </div>
              </template>

              <lightning-record-edit-form
                record-id={userId}
                object-api-name={objectApiName}
                class="slds-is-relative"
                onsubmit={handleSubmit}
                onsuccess={handleSuccess}
                onerror={handleError}
              >
                <template if:true={isSaving}>
                  <lightning-spinner
                    alternative-text="Saving"
                    size="small"
                  ></lightning-spinner>
                </template>

                <lightning-messages></lightning-messages>

                <template for:each={profileFieldRows} for:item="field">
                  <div key={field.key} class="slds-var-p-vertical_xx-small">
                    <template if:true={field.editable}>
                      <lightning-input-field
                        field-name={field.fieldName}
                        data-field={field.fieldName}
                        required={field.required}
                        onchange={handleFieldChange}
                      ></lightning-input-field>
                    </template>
                    <template if:true={field.readOnly}>
                      <lightning-output-field
                        field-name={field.fieldName}
                      ></lightning-output-field>
                    </template>
                  </div>
                </template>

                <template if:true={hasLocationFields}>
                  <div class="slds-section slds-is-open slds-var-m-top_small">
                    <h4 class="slds-section__title slds-theme_shade">
                      <span
                        class="slds-truncate slds-p-horizontal_small"
                        title="Location"
                        >Location</span
                      >
                    </h4>
                    <div class="slds-section__content slds-var-p-top_small">
                      <template for:each={locationFieldRows} for:item="field">
                        <div
                          key={field.key}
                          class="slds-var-p-vertical_xx-small"
                        >
                          <template if:true={field.editable}>
                            <lightning-input-field
                              field-name={field.fieldName}
                              data-field={field.fieldName}
                              required={field.required}
                              onchange={handleFieldChange}
                            ></lightning-input-field>
                          </template>
                          <template if:true={field.readOnly}>
                            <lightning-output-field
                              field-name={field.fieldName}
                            ></lightning-output-field>
                          </template>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>

                <div class="slds-var-m-top_medium">
                  <lightning-button
                    variant="neutral"
                    label="Cancel"
                    class="slds-var-m-right_x-small"
                    onclick={handleCancel}
                  ></lightning-button>
                  <lightning-button
                    variant="brand"
                    type="submit"
                    label="Save"
                  ></lightning-button>
                </div>
              </lightning-record-edit-form>
            </template>
          </div>
        </article>
      </lightning-tab>

      <!-- ═══════════════════ Change Password ═══════════════════ -->
      <template if:true={showPasswordSection}>
        <lightning-tab label="Change Password" value="change-password">
          <article class="slds-card">
            <div class="slds-card__header slds-grid">
              <header
                class="slds-media slds-media_center slds-has-flexi-truncate"
              >
                <div class="slds-media__figure">
                  <lightning-icon
                    icon-name="utility:lock"
                    size="small"
                  ></lightning-icon>
                </div>
                <div class="slds-media__body">
                  <h3 class="slds-card__header-title">
                    <span class="slds-text-heading_small"
                      >{passwordHeader}</span
                    >
                  </h3>
                </div>
              </header>
            </div>

            <div class="slds-card__body slds-card__body_inner">
              <div class="slds-is-relative">
                <template if:true={isChangingPassword}>
                  <lightning-spinner
                    alternative-text="Updating password"
                    size="small"
                  ></lightning-spinner>
                </template>

                <!-- Current password -->
                <div class="slds-form-element slds-var-m-bottom_small">
                  <label class="slds-form-element__label" for="ecup-current"
                    >Current Password</label
                  >
                  <div
                    class="slds-form-element__control slds-input-has-icon slds-input-has-icon_right"
                  >
                    <input
                      id="ecup-current"
                      type={currentType}
                      class="slds-input"
                      data-password="true"
                      autocomplete="current-password"
                      oninput={handleCurrentInput}
                    />
                    <button
                      type="button"
                      class="slds-button slds-button_icon slds-input__icon slds-input__icon_right"
                      title="Show or hide password"
                      onclick={toggleCurrent}
                    >
                      <lightning-icon
                        icon-name={currentToggleIcon}
                        size="x-small"
                        alternative-text="Show or hide current password"
                      ></lightning-icon>
                    </button>
                  </div>
                </div>

                <!-- New password -->
                <div class="slds-form-element slds-var-m-bottom_small">
                  <label class="slds-form-element__label" for="ecup-new"
                    >Password</label
                  >
                  <div
                    class="slds-form-element__control slds-input-has-icon slds-input-has-icon_right"
                  >
                    <input
                      id="ecup-new"
                      type={nextType}
                      class="slds-input"
                      data-password="true"
                      autocomplete="new-password"
                      oninput={handleNextInput}
                    />
                    <button
                      type="button"
                      class="slds-button slds-button_icon slds-input__icon slds-input__icon_right"
                      title="Show or hide password"
                      onclick={toggleNext}
                    >
                      <lightning-icon
                        icon-name={nextToggleIcon}
                        size="x-small"
                        alternative-text="Show or hide new password"
                      ></lightning-icon>
                    </button>
                  </div>
                </div>

                <!-- Confirm password -->
                <div class="slds-form-element slds-var-m-bottom_small">
                  <label class="slds-form-element__label" for="ecup-confirm"
                    >Confirm Password</label
                  >
                  <div
                    class="slds-form-element__control slds-input-has-icon slds-input-has-icon_right"
                  >
                    <input
                      id="ecup-confirm"
                      type={confirmType}
                      class="slds-input"
                      data-password="true"
                      autocomplete="new-password"
                      oninput={handleConfirmInput}
                    />
                    <button
                      type="button"
                      class="slds-button slds-button_icon slds-input__icon slds-input__icon_right"
                      title="Show or hide password"
                      onclick={toggleConfirm}
                    >
                      <lightning-icon
                        icon-name={confirmToggleIcon}
                        size="x-small"
                        alternative-text="Show or hide confirmation password"
                      ></lightning-icon>
                    </button>
                  </div>
                </div>

                <!-- Live criteria checklist -->
                <div class="slds-var-m-top_medium" aria-live="polite">
                  <p class="slds-text-body_regular slds-var-m-bottom_x-small">
                    Your password must:
                  </p>
                  <ul class="slds-list_vertical">
                    <template for:each={criteria} for:item="rule">
                      <li
                        key={rule.id}
                        class="slds-grid slds-grid_vertical-align-center slds-var-p-vertical_xx-small"
                      >
                        <lightning-icon
                          icon-name={rule.iconName}
                          variant={rule.iconVariant}
                          size="x-small"
                          class="slds-var-m-right_x-small"
                        ></lightning-icon>
                        <span class={rule.textClass}>{rule.label}</span>
                      </li>
                    </template>
                  </ul>
                </div>

                <!-- Inline server error -->
                <template if:true={passwordError}>
                  <div
                    class="slds-grid slds-grid_vertical-align-center slds-text-color_error slds-var-m-top_small"
                    role="alert"
                  >
                    <lightning-icon
                      icon-name="utility:error"
                      variant="error"
                      size="x-small"
                      class="slds-var-m-right_x-small"
                    ></lightning-icon>
                    <span>{passwordError}</span>
                  </div>
                </template>

                <div class="slds-var-m-top_medium">
                  <lightning-button
                    variant="brand"
                    label="Update Password"
                    disabled={disableSubmit}
                    onclick={handleChangePassword}
                  ></lightning-button>
                </div>
              </div>
            </div>
          </article>
        </lightning-tab>
      </template>
    </lightning-tabset>
  </div>
</template>
