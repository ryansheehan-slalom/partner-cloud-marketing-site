<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf1ff"/>
      <stop offset="1" stop-color="#d9f1fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#0c62fb" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#0c62fb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#0847c4" fill-opacity="0.12"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0a2540" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="800" height="640" fill="url(#bg)"/>
  <rect width="800" height="640" fill="url(#dots)"/>
  <rect width="800" height="640" fill="url(#glow)"/>

  <!-- Cluttered portal window -->
  <g filter="url(#sh)">
    <rect x="70" y="70" width="500" height="430" rx="22" fill="#ffffff"/>
  </g>
  <line x1="70" y1="114" x2="570" y2="114" stroke="#eef1f6" stroke-width="2"/>
  <circle cx="98" cy="92" r="5.5" fill="#ff8a80"/>
  <circle cx="116" cy="92" r="5.5" fill="#ffd166"/>
  <circle cx="134" cy="92" r="5.5" fill="#7ee2a8"/>
  <rect x="160" y="82" width="300" height="20" rx="10" fill="#f2f5fa"/>

  <!-- Overloaded sidebar -->
  <g fill="#dde3ec">
    <rect x="90" y="136" width="70" height="10" rx="5"/>
    <rect x="90" y="162" width="60" height="10" rx="5"/>
    <rect x="90" y="188" width="76" height="10" rx="5"/>
    <rect x="90" y="214" width="52" height="10" rx="5"/>
    <rect x="90" y="240" width="66" height="10" rx="5"/>
    <rect x="90" y="266" width="58" height="10" rx="5"/>
    <rect x="90" y="292" width="72" height="10" rx="5"/>
    <rect x="90" y="318" width="48" height="10" rx="5"/>
    <rect x="90" y="344" width="62" height="10" rx="5"/>
    <rect x="90" y="370" width="70" height="10" rx="5"/>
    <rect x="90" y="396" width="54" height="10" rx="5"/>
    <rect x="90" y="422" width="64" height="10" rx="5"/>
  </g>
  <line x1="190" y1="114" x2="190" y2="500" stroke="#eef1f6" stroke-width="2"/>

  <!-- Long deal-registration form -->
  <rect x="214" y="136" width="180" height="14" rx="7" fill="#0a2540" fill-opacity="0.85"/>
  <rect x="214" y="160" width="240" height="8" rx="4" fill="#c8d1de"/>
  <g fill="#c8d1de">
    <rect x="214" y="186" width="90" height="8" rx="4"/>
    <rect x="214" y="232" width="120" height="8" rx="4"/>
    <rect x="214" y="278" width="70" height="8" rx="4"/>
    <rect x="214" y="324" width="110" height="8" rx="4"/>
    <rect x="214" y="370" width="80" height="8" rx="4"/>
    <rect x="214" y="416" width="100" height="8" rx="4"/>
  </g>
  <g fill="#fafbfd" stroke="#dde3ec" stroke-width="1.5">
    <rect x="214" y="200" width="300" height="22" rx="6"/>
    <rect x="214" y="246" width="300" height="22" rx="6" stroke="#ef5b5b"/>
    <rect x="214" y="292" width="300" height="22" rx="6"/>
    <rect x="214" y="338" width="300" height="22" rx="6" stroke="#ef5b5b"/>
    <rect x="214" y="384" width="300" height="22" rx="6"/>
    <rect x="214" y="430" width="300" height="22" rx="6"/>
  </g>
  <g fill="#ef5b5b">
    <circle cx="498" cy="257" r="7"/>
    <circle cx="498" cy="349" r="7"/>
  </g>
  <g stroke="#ffffff" stroke-width="2" stroke-linecap="round">
    <path d="M498 253v4M498 260.5v0.5"/>
    <path d="M498 345v4M498 352.5v0.5"/>
  </g>
  <text x="214" y="482" font-size="12" fill="#64738b">Step 1 of 7 · 42 required fields</text>
  <rect x="552" y="128" width="6" height="360" rx="3" fill="#eef1f6"/>
  <rect x="552" y="134" width="6" height="38" rx="3" fill="#c8d1de"/>

  <!-- Pending registration card -->
  <g filter="url(#sh)">
    <rect x="470" y="108" width="276" height="92" rx="18" fill="#ffffff"/>
  </g>
  <path d="M510 136 532 174H488Z" fill="#fff4d6" stroke="#f5a524" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M510 149v11M510 166v0.5" stroke="#d48806" stroke-width="2.6" stroke-linecap="round"/>
  <text x="548" y="150" font-size="14" font-weight="700" fill="#0a2540">Registration pending</text>
  <text x="548" y="172" font-size="12" fill="#64738b">Day 14 · awaiting approval</text>

  <!-- Unclear tier status card -->
  <g filter="url(#sh)">
    <rect x="430" y="398" width="300" height="130" rx="18" fill="#ffffff"/>
  </g>
  <text x="454" y="434" font-size="14" font-weight="700" fill="#0a2540">Tier status</text>
  <circle cx="702" cy="429" r="13" fill="#e6efff"/>
  <text x="702" y="434" font-size="14" font-weight="800" fill="#0847c4" text-anchor="middle">?</text>
  <rect x="454" y="456" width="252" height="10" rx="5" fill="#eef1f6"/>
  <line x1="459" y1="461" x2="570" y2="461" stroke="#c8d1de" stroke-width="10" stroke-linecap="round" stroke-dasharray="1 14"/>
  <text x="454" y="496" font-size="12" fill="#64738b">Progress &amp; rewards unclear</text>

  <!-- Tangled partner path -->
  <path d="M140 566C190 520 230 624 262 572S318 518 292 592 352 640 378 584 432 556 420 598" fill="none" stroke="#0c62fb" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 8"/>
  <g filter="url(#sh)">
    <circle cx="112" cy="566" r="28" fill="#ffffff"/>
  </g>
  <circle cx="112" cy="558" r="8.5" fill="#0c62fb"/>
  <path d="M97 584q0-15 15-15q15 0 15 15Z" fill="#0c62fb"/>
  <circle cx="446" cy="600" r="18" fill="#ffffff" stroke="#ef5b5b" stroke-width="2.5" stroke-dasharray="4 4"/>
  <path d="M440 594l12 12M452 594l-12 12" stroke="#ef5b5b" stroke-width="2.5" stroke-linecap="round"/>
</svg>
