      <div class="pc-container">
        <div class="pc-prose">
          <p class="pc-prose__lead">A thriving partner ecosystem boosts adoption, scale, and innovation. But the impact hinges on something deceptively simple: whether a partner's first experiences feel effortless. The journeys you design in the first 30 days quietly set the ceiling for the next 30 months.</p>

          <p>Most programs treat onboarding as a checklist — provision access, share a deck, assign a rep. Partners treat it as a signal. If registering a deal is painful, if enablement is buried, if nobody notices their first win, they conclude the program isn't built for them. And they route around it.</p>

          <h2>Start from the partner's job, not your org chart</h2>
          <p>The most common failure mode is designing journeys around internal teams instead of the outcomes a partner is trying to reach. A partner doesn't want to "complete onboarding" — they want to close their first deal, get paid accurately, and know where they stand. Map to those outcomes and the friction points become obvious.</p>

          <blockquote class="pc-quote">
            "Partners don't remember your portal. They remember whether their first deal was easy — and whether anyone noticed when they won it."
          </blockquote>

          <h2>The 30-60-90 that shortens time-to-first-deal</h2>
          <p>We anchor every partner journey to three moments of proof. Each one is designed to remove a specific reason a partner might disengage.</p>

          <div class="pc-callout">
            <strong class="pc-callout__title">Key takeaways</strong>
            <ul class="pc-callout__list">
              <li><strong>Days 0–30:</strong> One-click deal registration and a guided first win — remove pipeline friction immediately.</li>
              <li><strong>Days 31–60:</strong> Contextual enablement surfaced inside the flow of work, not in a separate LMS.</li>
              <li><strong>Days 61–90:</strong> Visible tiering progress and recognition so early momentum compounds into loyalty.</li>
            </ul>
          </div>

          <h2>Make progress visible</h2>
          <p>Recognition is the cheapest retention lever most programs ignore. When partners can see their tier progress, rewards, and standing without asking, loyalty stops being a mystery and starts being a scoreboard. That visibility is what turns a one-time producer into a durable channel.</p>

          <figure class="pc-figure">
            <div class="pc-figure__img" aria-hidden="true"></div>
            <figcaption>A partner journey mapped to outcomes — register, enable, progress — rather than internal handoffs.</figcaption>
          </figure>

          <h2>Where to start</h2>
          <p>You don't need to rebuild the whole program to feel the impact. Pick the single most painful step in a partner's first 30 days — usually deal registration — and remove the friction there first. Measure time-to-first-deal before and after. The rest of the journey becomes far easier to justify once that number moves.</p>
